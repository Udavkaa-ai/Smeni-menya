services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smeni
    volumes:
      - smeni_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/smeni
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@smeni-menya.local}
      SVETA_PASSWORD: ${SVETA_PASSWORD:-sveta123}
      MARIA_PASSWORD: ${MARIA_PASSWORD:-maria123}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
        VITE_WS_BASE: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  smeni_pg:
