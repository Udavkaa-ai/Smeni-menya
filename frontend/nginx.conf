# Backend upstream — host[:port].
# For private networking (recommended within one Railway project):
#   BACKEND_HOST=<service>.railway.internal:8080
#   BACKEND_PROTO=http
#   BACKEND_HOST_HEADER=<service>.railway.internal
# For public Railway domain (cross-project or simpler setup):
#   BACKEND_HOST=<service>-production-xxxx.up.railway.app:443
#   BACKEND_PROTO=https
#   BACKEND_HOST_HEADER=<service>-production-xxxx.up.railway.app
upstream smeni_backend {
  server ${BACKEND_HOST};
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  # ---- API proxy ---- #
  location /api/ {
    proxy_pass ${BACKEND_PROTO}://smeni_backend/;
    proxy_ssl_server_name on;
    proxy_set_header Host ${BACKEND_HOST_HEADER};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  # ---- WebSocket proxy ---- #
  location /ws {
    proxy_pass ${BACKEND_PROTO}://smeni_backend/ws;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host ${BACKEND_HOST_HEADER};
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
  }

  # ---- SPA fallback ---- #
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    expires 0;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
