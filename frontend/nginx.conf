# Resolver for re-resolving the backend hostname at request time.
# 127.0.0.11 is the in-container DNS (works on Railway/Docker), 8.8.8.8 fallback.
# `valid=10s` makes nginx forget the cached IP every 10s — saves us from a
# stale upstream after backend redeploys.
#
# Note: we deliberately do NOT use an `upstream {}` block, because it caches
# DNS only at config-load time. With a variable in `proxy_pass`, nginx
# re-resolves on each request via this resolver.
#
# BACKEND_HOST          host[:port], e.g. service.railway.internal:8080
# BACKEND_PROTO         http or https
# BACKEND_HOST_HEADER   value for the Host header (no port)
server {
  # @@RESOLVER@@ is replaced at container start with the nameservers from
  # /etc/resolv.conf — works on Railway (which uses IPv6 private networking)
  # and Docker. We deliberately do NOT pass ipv6=off because Railway's
  # private domains return AAAA records.
  resolver @@RESOLVER@@ valid=10s;
  resolver_timeout 5s;

  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  # Stash env-substituted upstream into a variable so proxy_pass triggers
  # request-time DNS lookup via the resolver above.
  set $backend_upstream "${BACKEND_HOST}";

  # ---- API proxy ---- #
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass ${BACKEND_PROTO}://$backend_upstream;
    proxy_ssl_server_name on;
    proxy_set_header Host ${BACKEND_HOST_HEADER};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_504;
  }

  # ---- WebSocket proxy ---- #
  location /ws {
    proxy_pass ${BACKEND_PROTO}://$backend_upstream/ws;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host ${BACKEND_HOST_HEADER};
    proxy_connect_timeout 15s;
    proxy_read_timeout 3600s;
  }

  # ---- SPA fallback ---- #
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    expires 0;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
