# Backend upstream — overridden via env via /etc/nginx/templates if needed.
# In docker-compose, "backend" is the service name and resolves via Docker DNS.
upstream smeni_backend {
  server ${BACKEND_HOST};
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  # ---- API proxy ---- #
  location /api/ {
    proxy_pass http://smeni_backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # ---- WebSocket proxy ---- #
  location /ws {
    proxy_pass http://smeni_backend/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # ---- SPA fallback ---- #
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    expires 0;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
